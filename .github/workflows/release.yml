name: Release

# Publishes svgreel after the version pull request is merged.
#
# - On the version pull request: verifies and packs the version commit before the merge.
# - On `main`: stages the package on npm (environment `npm-release`); a maintainer publishes it by
#   approving the staged version with 2FA. Then drafts the GitHub Release, which the maintainer
#   publishes after the npm approval (GitHub creates the tag then).
#
# Environment `npm-release`: npm trusts this workflow (trusted publishing over OIDC), so no token
# is stored.

on:
  # `pnpm version -r` updates the ledger, so this push always carries a version commit.
  push:
    branches: [main]
    paths:
      - ".changeset/ledger.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".changeset/ledger.yaml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify and pack, but do not upload
        type: boolean
        default: true

permissions:
  contents: read

# A pull request run must not wait for a release on `main`, but a release must finish its uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify ${{ matrix.task }}
    # Pull request runs are limited to this repository's version branch. A fork can also name a
    # branch `version/main`.
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        task: [check, test, build, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - run: vp run "$TASK"
        env:
          TASK: ${{ matrix.task }}

  package:
    name: Pack svgreel
    if: github.event_name != 'pull_request' || (github.head_ref == 'version/main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - run: vp run svgreel#build
      # Recursive publication skips private packages and versions that already exist on npm.
      - run: vp exec pnpm publish -r --dry-run --no-git-checks --ignore-scripts
      - name: Archive the build
        run: tar --create --gzip --file svgreel-dist.tar.gz packages/core/dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: svgreel-dist
          path: svgreel-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Stage on npm
    needs: [verify, package]
    # A push has no inputs, so `dry-run` is empty and the job stages the package.
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: svgreel-dist
      - run: tar --extract --gzip --file svgreel-dist.tar.gz
      - name: Select the npm tag
        id: tag
        run: |
          version=$(node --print "require('./packages/core/package.json').version")
          case "$version" in
            *-*) echo 'name=next' >> "$GITHUB_OUTPUT" ;;
            *) echo 'name=latest' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Stage
        env:
          NPM_TAG: ${{ steps.tag.outputs.name }}
        # Branch rules and the job condition replace pnpm's Git checks. The verify job already ran
        # the tests that prepublishOnly would run.
        run: vp exec pnpm stage publish -r --no-git-checks --ignore-scripts --tag "$NPM_TAG" --report-summary
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: publish-summary
          path: pnpm-publish-summary.json
          if-no-files-found: ignore
          retention-days: 30

  github-release:
    name: Draft GitHub Release
    needs: [publish]
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.0"
          cache: false
          run-install: false
      # The body asks a coding agent to write the notes from the changelog and to check the
      # release (scripts/release-draft.ts). A rerun after a partial failure keeps an existing draft.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node --print "require('./packages/core/package.json').version")
          flags=()
          list=(--exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          case "$version" in
            *-*) flags+=(--prerelease --latest=false) ;;
            # The notes of a stable release cover every change since the previous stable release.
            *) list+=(--exclude-pre-releases) ;;
          esac
          export RELEASE_TAGS
          RELEASE_TAGS=$(gh release list "${list[@]}")
          tag=$(node scripts/release-draft.ts --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --body-file "$RUNNER_TEMP/release-body.md")
          draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2> /dev/null || true)
          case "$draft" in
            false) echo "The GitHub Release $tag is already published." ;;
            true) echo "The draft GitHub Release $tag already exists." ;;
            *) gh release create "$tag" --draft --target "$GITHUB_SHA" --title "svgreel $tag" --notes-file "$RUNNER_TEMP/release-body.md" "${flags[@]}" ;;
          esac
